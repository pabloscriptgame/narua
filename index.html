<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NARUA RPG</title>
  <link rel="icon" type="image/png" href="https://iili.io/qsB9H21.png">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Share+Tech+Mono&family=Oswald:wght@700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --purple:  #BF00FF;
      --purple2: #8B00E6;
      --cyan:    #00FFFF;
      --dark:    #04020C;
      --deep:    #06000F;
      --gold:    #FFD700;
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--dark);
      font-family: 'Oswald', sans-serif;
      cursor: none;
    }

    /* ── CUSTOM CURSOR ── */
    #cursor {
      position: fixed; z-index: 9999;
      width: 12px; height: 12px;
      border: 1px solid var(--purple);
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%,-50%);
      transition: transform .1s ease;
      box-shadow: 0 0 8px var(--purple), inset 0 0 4px rgba(191,0,255,.3);
    }
    #cursor-trail {
      position: fixed; z-index: 9998;
      width: 32px; height: 32px;
      border: 1px solid rgba(191,0,255,.25);
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%,-50%);
      transition: left .15s ease, top .15s ease;
    }

    /* ── TUNNEL CANVAS ── */
    #tunnel-canvas {
      position: fixed; inset: 0; z-index: 0;
    }

    /* ── PARTICLE CANVAS ── */
    #particle-canvas {
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
    }

    /* ── VIGNETTE ── */
    .vignette {
      position: fixed; inset: 0; z-index: 2; pointer-events: none;
      background: radial-gradient(ellipse at center,
        transparent 25%,
        rgba(4,2,12,.65) 65%,
        rgba(4,2,12,.98) 100%);
    }

    /* ── SCAN LINES ── */
    .scanlines {
      position: fixed; inset: 0; z-index: 3; pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px, transparent 3px,
        rgba(0,0,0,.08) 3px, rgba(0,0,0,.08) 4px
      );
      animation: scanMove 8s linear infinite;
    }
    @keyframes scanMove {
      0%   { background-position: 0 0; }
      100% { background-position: 0 100px; }
    }

    /* ── GLITCH OVERLAY ── */
    .glitch-overlay {
      position: fixed; inset: 0; z-index: 50; pointer-events: none;
      opacity: 0;
      background: rgba(191,0,255,.06);
      animation: glitchFlash 4s infinite;
    }
    @keyframes glitchFlash {
      0%,100%  { opacity:0; transform:none; }
      10%      { opacity:1; transform:skewX(.6deg) translateX(-3px); clip-path: inset(20% 0 60% 0); }
      10.3%    { opacity:0; transform:none; clip-path: none; }
      10.6%    { opacity:.7; transform:skewX(-.3deg) translateX(3px); clip-path: inset(60% 0 15% 0); }
      11%      { opacity:0; transform:none; clip-path: none; }
      55%      { opacity:.5; transform:skewX(-.2deg) translateX(2px); }
      55.3%    { opacity:0; transform:none; }
      80%      { opacity:.3; transform:skewY(.1deg); }
      80.2%    { opacity:0; }
    }

    /* ── RGB SPLIT OVERLAY ── */
    .rgb-overlay {
      position: fixed; inset: 0; z-index: 4; pointer-events: none;
      opacity: 0;
      mix-blend-mode: screen;
      animation: rgbSplit 6s infinite;
    }
    .rgb-overlay::before, .rgb-overlay::after {
      content: ''; position: absolute; inset: 0;
    }
    .rgb-overlay::before {
      background: rgba(255,0,80,.02);
      transform: translateX(-2px);
    }
    .rgb-overlay::after {
      background: rgba(0,255,255,.02);
      transform: translateX(2px);
    }
    @keyframes rgbSplit {
      0%,90%,100% { opacity:0; }
      92%  { opacity:1; }
      93%  { opacity:0; }
      95%  { opacity:1; }
      96%  { opacity:0; }
    }

    /* ── DATA STREAM LINES ── */
    .data-stream {
      position: fixed; z-index: 5; pointer-events: none;
      width: 1px; top: 0; bottom: 0;
      background: linear-gradient(180deg,
        transparent 0%,
        rgba(191,0,255,.0) 40%,
        rgba(191,0,255,.6) 50%,
        rgba(0,255,255,.4) 52%,
        rgba(191,0,255,.0) 60%,
        transparent 100%);
      animation: streamFall var(--dur) linear infinite;
      animation-delay: var(--delay);
      opacity: 0;
    }
    @keyframes streamFall {
      0%   { background-position: 0 -100vh; opacity:.6; }
      100% { background-position: 0 200vh;  opacity:0; }
    }

    /* ── CORNERS ── */
    .corner {
      position: fixed; z-index: 20;
      width: 52px; height: 52px;
      opacity: .6;
      animation: cornerPulse 2.5s ease-in-out infinite alternate;
    }
    .corner::before, .corner::after {
      content: '';
      position: absolute;
      width: 6px; height: 6px;
      background: var(--purple);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--purple), 0 0 16px var(--purple);
    }
    @keyframes cornerPulse { from { opacity:.3; } to { opacity:.85; } }
    .corner--tl { top:14px; left:14px;  border-top:2px solid var(--purple); border-left:2px solid var(--purple); }
    .corner--tl::before { top:-3px; left:-3px; }
    .corner--tl::after  { bottom:0; right:0; width:3px; height:3px; background:rgba(191,0,255,.4); }
    .corner--tr { top:14px; right:14px; border-top:2px solid var(--purple); border-right:2px solid var(--purple); }
    .corner--tr::before { top:-3px; right:-3px; }
    .corner--tr::after  { bottom:0; left:0; width:3px; height:3px; background:rgba(191,0,255,.4); }
    .corner--bl { bottom:14px; left:14px;  border-bottom:2px solid var(--purple); border-left:2px solid var(--purple); }
    .corner--bl::before { bottom:-3px; left:-3px; }
    .corner--bl::after  { top:0; right:0; width:3px; height:3px; background:rgba(191,0,255,.4); }
    .corner--br { bottom:14px; right:14px; border-bottom:2px solid var(--purple); border-right:2px solid var(--purple); }
    .corner--br::before { bottom:-3px; right:-3px; }
    .corner--br::after  { top:0; left:0; width:3px; height:3px; background:rgba(191,0,255,.4); }

    /* ── HUD LINES ── */
    .hud-h {
      position: fixed; z-index: 10; pointer-events: none;
      left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg,
        transparent 0%,
        rgba(191,0,255,.06) 15%,
        rgba(191,0,255,.25) 50%,
        rgba(0,255,255,.15) 65%,
        rgba(191,0,255,.06) 85%,
        transparent 100%);
      animation: hudScan 3s ease-in-out infinite alternate;
    }
    @keyframes hudScan {
      from { opacity:.6; }
      to   { opacity:1; box-shadow: 0 0 12px rgba(191,0,255,.2); }
    }
    .hud-h--t { top: 58px; }
    .hud-h--b { bottom: 58px; }
    .hud-v {
      position: fixed; z-index: 10; pointer-events: none;
      top: 0; bottom: 0; width: 1px;
      background: linear-gradient(180deg,
        transparent,
        rgba(191,0,255,.12) 30%,
        rgba(191,0,255,.2) 50%,
        rgba(191,0,255,.12) 70%,
        transparent);
    }
    .hud-v--l { left: 58px; }
    .hud-v--r { right: 58px; }

    /* ── HUD READOUTS ── */
    .hud-readout {
      position: fixed; z-index: 20; pointer-events: none;
      font-family: 'Share Tech Mono', monospace;
      font-size: .52rem;
      letter-spacing: 2px;
      color: rgba(191,0,255,.4);
      text-transform: uppercase;
      line-height: 1.9;
    }
    .hud-readout--tl { top: 70px; left: 70px; }
    .hud-readout--tr { top: 70px; right: 70px; text-align: right; }
    .hud-readout--bl { bottom: 70px; left: 70px; }
    .hud-readout--br { bottom: 70px; right: 70px; text-align: right; }
    .hud-readout span { color: rgba(0,255,255,.55); }

    /* ── ELECTRIC ARCS ── */
    #arc-canvas {
      position: fixed; inset: 0; z-index: 6; pointer-events: none;
    }

    /* ── STAGE ── */
    .stage {
      position: relative; z-index: 15;
      width: 100%; height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: flex-end;
      padding-bottom: 52px;
    }

    /* ── LOGO ── */
    .logo-wrap {
      position: fixed;
      bottom: 155px;
      left: 50%; transform: translateX(-50%);
      z-index: 14;
    }
    .logo-img {
      width: clamp(240px, 52vw, 440px);
      height: auto;
      opacity: .18;
      filter:
        drop-shadow(0 0 30px rgba(191,0,255,1))
        drop-shadow(0 0 80px rgba(191,0,255,.6));
      animation: logoPulse 3s ease-in-out infinite;
    }
    @keyframes logoPulse {
      0%,100% {
        opacity:.12;
        filter:
          drop-shadow(0 0 24px rgba(191,0,255,.9))
          drop-shadow(0 0 60px rgba(191,0,255,.5));
      }
      50% {
        opacity:.26;
        filter:
          drop-shadow(0 0 48px rgba(191,0,255,1))
          drop-shadow(0 0 120px rgba(191,0,255,.8))
          drop-shadow(0 0 4px rgba(0,255,255,.3));
      }
    }

    /* ── CHARACTER ── */
    .char-wrap {
      position: relative;
      width: min(360px, 78vw);
      margin-bottom: -10px;
      animation: charFloat 3.2s ease-in-out infinite;
      z-index: 20;
    }
    @keyframes charFloat {
      0%,100% { transform: translateY(0) rotate(-.3deg); }
      50%      { transform: translateY(-18px) rotate(.3deg); }
    }

    /* Aura rings around character */
    .char-aura {
      position: absolute;
      bottom: 20px; left: 50%;
      transform: translateX(-50%);
      width: 60%; height: 30px;
      pointer-events: none;
    }
    .char-aura::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(191,0,255,.45) 0%, transparent 70%);
      filter: blur(10px);
      animation: aura1 3.2s ease-in-out infinite;
    }
    .char-aura::after {
      content: '';
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(0,255,255,.18) 0%, transparent 65%);
      filter: blur(15px);
      animation: aura2 3.2s ease-in-out infinite reverse;
    }
    @keyframes aura1 {
      0%,100% { transform: scaleX(.85) scaleY(.7); opacity:.5; }
      50%      { transform: scaleX(1.1) scaleY(1); opacity:1; }
    }
    @keyframes aura2 {
      0%,100% { transform: scaleX(1) scaleY(.8); opacity:.3; }
      50%      { transform: scaleX(.85) scaleY(1.1); opacity:.6; }
    }

    .char-img {
      width: 100%; height: auto;
      filter:
        drop-shadow(0 0 28px rgba(191,0,255,.65))
        drop-shadow(0 0 60px rgba(191,0,255,.2))
        drop-shadow(-6px 22px 22px rgba(0,0,0,.98));
      animation: charGlow 3.2s ease-in-out infinite;
    }
    @keyframes charGlow {
      0%,100% {
        filter:
          drop-shadow(0 0 20px rgba(191,0,255,.5))
          drop-shadow(0 0 50px rgba(191,0,255,.15))
          drop-shadow(-6px 22px 22px rgba(0,0,0,.98));
      }
      50% {
        filter:
          drop-shadow(0 0 40px rgba(191,0,255,.9))
          drop-shadow(0 0 90px rgba(191,0,255,.4))
          drop-shadow(2px 0 12px rgba(0,255,255,.2))
          drop-shadow(-6px 22px 22px rgba(0,0,0,.98));
      }
    }

    /* ── CARD ── */
    .redirect-card {
      position: relative;
      background: rgba(6,0,14,.85);
      border: 1px solid rgba(191,0,255,.3);
      border-radius: 4px;
      padding: 1.15rem 2.4rem 1.25rem;
      text-align: center;
      box-shadow:
        0 0 0 1px rgba(191,0,255,.06),
        0 0 60px rgba(191,0,255,.18),
        0 0 120px rgba(191,0,255,.06),
        inset 0 1px 0 rgba(191,0,255,.12),
        inset 0 -1px 0 rgba(0,255,255,.05);
      backdrop-filter: blur(20px) saturate(1.4);
      animation: cardIn .7s cubic-bezier(.15,.85,.2,1) .25s both;
      margin-bottom: 8px;
      z-index: 20;
      overflow: hidden;
    }

    /* Holographic tilt handled by JS */
    .redirect-card::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg,
        rgba(191,0,255,.04) 0%,
        transparent 40%,
        rgba(0,255,255,.03) 100%);
      pointer-events: none;
    }

    /* Top cyan accent line */
    .redirect-card::after {
      content: '';
      position: absolute;
      top: 0; left: 10%; right: 10%;
      height: 1px;
      background: linear-gradient(90deg,
        transparent, rgba(0,255,255,.5), rgba(191,0,255,.8), rgba(0,255,255,.5), transparent);
      animation: topLineFlicker 2s ease-in-out infinite;
    }
    @keyframes topLineFlicker {
      0%,100% { opacity:.6; }
      50%      { opacity:1; box-shadow: 0 0 8px var(--cyan); }
    }

    .card-shine {
      position: absolute;
      top: 0; left: -80%;
      width: 35%; height: 100%;
      background: linear-gradient(90deg,
        transparent,
        rgba(191,0,255,.04),
        rgba(255,255,255,.06),
        rgba(0,255,255,.04),
        transparent);
      animation: cardShine 4.5s ease-in-out infinite;
      transform: skewX(-15deg);
    }
    @keyframes cardShine {
      0%   { left: -80%; }
      55%  { left: 160%; }
      100% { left: 160%; }
    }

    @keyframes cardIn {
      from { opacity:0; transform: translateY(28px) scale(.96); filter: blur(4px); }
      to   { opacity:1; transform: none; filter: none; }
    }

    .card-label {
      font-family: 'Share Tech Mono', monospace;
      font-size: .62rem;
      letter-spacing: 4px;
      color: rgba(191,0,255,.6);
      text-transform: uppercase;
      margin-bottom: .45rem;
      animation: labelBlink 3s ease-in-out infinite;
    }
    @keyframes labelBlink {
      0%,90%,100% { opacity:1; }
      92% { opacity:.3; }
      94% { opacity:1; }
      96% { opacity:.5; }
      98% { opacity:1; }
    }

    .card-title {
      font-family: 'Bebas Neue', cursive;
      font-size: clamp(1.4rem, 4.5vw, 2rem);
      letter-spacing: 6px;
      color: #fff;
      text-shadow:
        0 0 20px rgba(191,0,255,.6),
        0 0 40px rgba(191,0,255,.3),
        2px 0 0 rgba(0,255,255,.08);
      position: relative;
    }
    .card-title span {
      color: var(--purple);
      text-shadow:
        0 0 20px rgba(191,0,255,1),
        0 0 40px rgba(191,0,255,.6),
        0 0 80px rgba(191,0,255,.3);
    }

    /* Glitch title clone */
    .card-title::before {
      content: 'NARUA RPG';
      position: absolute; top:0; left:0; right:0;
      color: rgba(0,255,255,.3);
      clip-path: inset(0 0 60% 0);
      transform: translateX(-2px);
      animation: titleGlitch 5s infinite;
      pointer-events: none;
    }
    @keyframes titleGlitch {
      0%,85%,100% { opacity:0; transform:translateX(0); }
      87% { opacity:1; transform:translateX(-3px); clip-path: inset(30% 0 40% 0); }
      88% { opacity:1; transform:translateX(3px);  clip-path: inset(60% 0 10% 0); }
      89% { opacity:0; }
    }

    /* ── COUNTDOWN ── */
    .countdown-wrap {
      display: flex; align-items: center; justify-content: center;
      gap: 18px; margin-top: .9rem;
    }
    .ring-svg { width: 54px; height: 54px; filter: drop-shadow(0 0 6px rgba(191,0,255,.4)); }
    .ring-bg  { fill: none; stroke: rgba(191,0,255,.1); stroke-width: 3; }
    .ring-arc {
      fill: none; stroke: var(--purple); stroke-width: 3;
      stroke-linecap: round;
      stroke-dasharray: 138; stroke-dashoffset: 0;
      transform: rotate(-90deg); transform-origin: center;
      transition: stroke-dashoffset 1s linear;
      filter: drop-shadow(0 0 4px var(--purple)) drop-shadow(0 0 8px var(--purple));
    }
    .ring-num {
      font-family: 'Share Tech Mono', monospace;
      font-size: 1.35rem;
      fill: var(--purple);
      filter: drop-shadow(0 0 4px var(--purple));
    }
    .ring-tick {
      fill: none; stroke: rgba(0,255,255,.2); stroke-width: .5;
      stroke-dasharray: 2 6;
    }
    .cd-text {
      font-family: 'Share Tech Mono', monospace;
      font-size: .72rem;
      letter-spacing: 2px;
      color: rgba(255,255,255,.38);
      text-transform: uppercase;
      text-align: left;
      line-height: 1.9;
    }
    .cd-text strong {
      color: rgba(191,0,255,.9);
      display: block;
      text-shadow: 0 0 8px rgba(191,0,255,.5);
    }

    /* ── PROGRESS ── */
    .prog-bar {
      width: 220px; height: 2px;
      background: rgba(255,255,255,.04);
      border-radius: 2px;
      margin: .9rem auto 0;
      overflow: visible;
      position: relative;
    }
    .prog-bar::before, .prog-bar::after {
      content: '';
      position: absolute;
      top: 50%; transform: translateY(-50%);
      width: 4px; height: 4px;
      border-radius: 50%;
      background: var(--purple);
      box-shadow: 0 0 6px var(--purple);
    }
    .prog-bar::before { left: -2px; }
    .prog-bar::after  { right: -2px; }

    .prog-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--purple2), var(--purple), #00FFFF);
      box-shadow: 0 0 12px var(--purple), 0 0 24px rgba(191,0,255,.4);
      transform-origin: left;
      animation: progDrain 5s linear forwards;
      position: relative;
    }
    .prog-fill::after {
      content: '';
      position: absolute;
      right: -4px; top: 50%; transform: translateY(-50%);
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 6px var(--cyan), 0 0 12px var(--cyan);
    }
    @keyframes progDrain {
      from { transform: scaleX(1); }
      to   { transform: scaleX(0); }
    }

    /* ── WARP TRANSITION ── */
    #warp-overlay {
      position: fixed; inset: 0; z-index: 100;
      background: radial-gradient(circle at center,
        #fff 0%,
        #BF00FF 20%,
        #4400AA 50%,
        #06000F 80%);
      transform: scale(0);
      opacity: 0;
      border-radius: 50%;
      transition: none;
      pointer-events: none;
    }
    #warp-overlay.go {
      animation: warpIn .9s cubic-bezier(.65,0,.35,1) forwards;
    }
    @keyframes warpIn {
      0%   { transform: scale(0); opacity: 1; border-radius: 50%; filter: brightness(3); }
      40%  { transform: scale(1.2); opacity: 1; border-radius: 20%; filter: brightness(1.5); }
      60%  { transform: scale(1.6); opacity: 1; border-radius: 0; }
      100% { transform: scale(4);  opacity: 1; border-radius: 0; filter: brightness(.5); }
    }

    /* ── ENERGY LINES (emanating from center outward) ── */
    #energy-canvas {
      position: fixed; inset: 0; z-index: 7; pointer-events: none;
    }

  </style>
</head>
<body>

  <!-- Custom cursor -->
  <div id="cursor"></div>
  <div id="cursor-trail"></div>

  <!-- Canvases -->
  <canvas id="tunnel-canvas"></canvas>
  <canvas id="particle-canvas"></canvas>
  <canvas id="arc-canvas"></canvas>
  <canvas id="energy-canvas"></canvas>

  <!-- Atmosphere -->
  <div class="vignette"></div>
  <div class="scanlines"></div>
  <div class="glitch-overlay"></div>
  <div class="rgb-overlay"></div>

  <!-- Data streams -->
  <div class="data-stream" style="left:8%;  --dur:3.4s; --delay:.2s;"></div>
  <div class="data-stream" style="left:22%; --dur:4.1s; --delay:1.1s;"></div>
  <div class="data-stream" style="left:35%; --dur:2.9s; --delay:.7s;"></div>
  <div class="data-stream" style="left:50%; --dur:3.7s; --delay:2s;"></div>
  <div class="data-stream" style="left:65%; --dur:4.3s; --delay:.4s;"></div>
  <div class="data-stream" style="left:78%; --dur:3.1s; --delay:1.6s;"></div>
  <div class="data-stream" style="left:92%; --dur:2.7s; --delay:.9s;"></div>

  <!-- HUD frame -->
  <div class="hud-h hud-h--t"></div>
  <div class="hud-h hud-h--b"></div>
  <div class="hud-v hud-v--l"></div>
  <div class="hud-v hud-v--r"></div>

  <!-- Corners -->
  <div class="corner corner--tl"></div>
  <div class="corner corner--tr"></div>
  <div class="corner corner--bl"></div>
  <div class="corner corner--br"></div>

  <!-- HUD Readouts -->
  <div class="hud-readout hud-readout--tl">
    SYS_ID: <span id="sysId">N4RU4-7X</span><br>
    NODE: <span>GATEWAY_01</span><br>
    PING: <span id="pingVal">--</span>ms
  </div>
  <div class="hud-readout hud-readout--tr">
    STATUS: <span id="statusTxt">CONNECTING</span><br>
    ENCRYPT: <span>AES-512</span><br>
    SYNC: <span id="syncPct">0</span>%
  </div>
  <div class="hud-readout hud-readout--bl">
    NEURAL: <span>LINKED</span><br>
    VER: <span>3.7.2</span>
  </div>
  <div class="hud-readout hud-readout--br">
    <span id="timeDisp">00:00:00</span><br>
    LAT: <span>OPTIMAL</span>
  </div>

  <!-- Warp transition -->
  <div id="warp-overlay"></div>

  <!-- Logo -->
  <div class="logo-wrap">
    <img class="logo-img" src="https://iili.io/qsB9H21.png" alt="NARUA RPG">
  </div>

  <!-- Stage -->
  <div class="stage">

    <!-- Character -->
    <div class="char-wrap" id="charWrap">
      <div class="char-aura"></div>
      <img class="char-img"
           src="https://iili.io/B2GiNMG.png"
           alt="Personagem NARUA RPG">
    </div>

    <!-- Card -->
    <div class="redirect-card" id="redirectCard">
      <div class="card-shine"></div>
      <div class="card-label">▸ Sincronizando consciência</div>
      <div class="card-title">NARUA <span>RPG</span></div>

      <div class="countdown-wrap">
        <svg class="ring-svg" viewBox="0 0 46 46">
          <circle class="ring-tick" cx="23" cy="23" r="20"/>
          <circle class="ring-bg"   cx="23" cy="23" r="22"/>
          <circle class="ring-arc"  cx="23" cy="23" r="22" id="ringArc"/>
          <text class="ring-num" x="23" y="28" text-anchor="middle" id="cdNum">5</text>
        </svg>
        <div class="cd-text">
          <strong id="cdMsg">Iniciando portal…</strong>
          naruarpg.gamer.gd
        </div>
      </div>

      <div class="prog-bar">
        <div class="prog-fill"></div>
      </div>
    </div>

  </div>

<script>
/* ══════════════════════════════════════════════
   CURSOR
══════════════════════════════════════════════ */
const cursor      = document.getElementById('cursor');
const cursorTrail = document.getElementById('cursor-trail');
let mx = window.innerWidth/2, my = window.innerHeight/2;
let tx = mx, ty = my;

document.addEventListener('mousemove', e => {
  mx = e.clientX; my = e.clientY;
  cursor.style.left = mx + 'px';
  cursor.style.top  = my + 'px';
});

function animCursor() {
  tx += (mx - tx) * .12;
  ty += (my - ty) * .12;
  cursorTrail.style.left = tx + 'px';
  cursorTrail.style.top  = ty + 'px';
  requestAnimationFrame(animCursor);
}
animCursor();

/* ══════════════════════════════════════════════
   CANVAS SETUP
══════════════════════════════════════════════ */
function setupCanvas(id) {
  const c = document.getElementById(id);
  const x = c.getContext('2d');
  function resize() {
    c.width  = window.innerWidth;
    c.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();
  return { c, x, get W() { return c.width; }, get H() { return c.height; }, get CX() { return c.width/2; }, get CY() { return c.height/2; } };
}

const tunnel   = setupCanvas('tunnel-canvas');
const partCtx  = setupCanvas('particle-canvas');
const arcCtx   = setupCanvas('arc-canvas');
const energyCtx= setupCanvas('energy-canvas');

/* ══════════════════════════════════════════════
   TUNNEL / WORMHOLE
══════════════════════════════════════════════ */
const RINGS  = 28;
const SPOKES = 14;
const SPEED  = 1.6;
let   camZoom = 1;
let   warpActive = false;
let   t = 0;

let rings = [];
function mkRing(z) {
  return {
    z,
    hue:   270 + Math.random() * 70 - 35,
    cyan:  Math.random() > .72,
    twist: Math.random() * Math.PI * 2,
    thickness: .8 + Math.random() * .8,
  };
}
for (let i = 0; i < RINGS; i++) rings.push(mkRing(i / RINGS));

function drawTunnel() {
  const { x, W, H, CX, CY } = tunnel;
  x.clearRect(0, 0, W, H);

  // Deep space bg
  const grad = x.createRadialGradient(CX, CY, 0, CX, CY, Math.min(W, H) * .6);
  grad.addColorStop(0,   'rgba(40,0,80,.6)');
  grad.addColorStop(.4,  'rgba(15,0,35,.45)');
  grad.addColorStop(.8,  'rgba(4,0,12,.3)');
  grad.addColorStop(1,   'transparent');
  x.fillStyle = grad;
  x.fillRect(0, 0, W, H);

  // Rings sorted far → near
  [...rings].sort((a, b) => a.z - b.z).forEach(ring => {
    const ps   = ring.z;
    const rad  = ps * Math.min(W, H) * .68 * camZoom;
    const alp  = ps * .8;
    if (rad < 2) return;

    // Outer ring glow (wide, soft)
    x.beginPath();
    x.arc(CX, CY, rad, 0, Math.PI * 2);
    x.strokeStyle = ring.cyan
      ? `rgba(0,255,255,${alp * .3})`
      : `rgba(191,0,255,${alp * .35})`;
    x.lineWidth   = 10 * ps;
    x.globalAlpha = alp * .3;
    x.shadowColor = ring.cyan ? '#00FFFF' : '#BF00FF';
    x.shadowBlur  = 30 * ps;
    x.stroke();

    // Core ring
    x.beginPath();
    x.arc(CX, CY, rad, 0, Math.PI * 2);
    x.strokeStyle = ring.cyan
      ? `rgba(0,255,255,${alp * .7})`
      : `rgba(191,0,255,${alp})`;
    x.lineWidth   = ring.thickness;
    x.globalAlpha = alp;
    x.shadowBlur  = 22 * ps;
    x.stroke();

    // Inner dashed decoration ring
    x.beginPath();
    x.arc(CX, CY, rad * .8, 0, Math.PI * 2);
    x.setLineDash([3, 9]);
    x.strokeStyle = `rgba(191,0,255,${alp * .15})`;
    x.lineWidth   = .5;
    x.shadowBlur  = 0;
    x.stroke();
    x.setLineDash([]);

    // Spokes
    for (let s = 0; s < SPOKES; s++) {
      const angle  = (s / SPOKES) * Math.PI * 2 + ring.twist + t * .003;
      const innerR = rad * .15;
      x.beginPath();
      x.moveTo(CX + Math.cos(angle) * innerR, CY + Math.sin(angle) * innerR);
      x.lineTo(CX + Math.cos(angle) * rad,    CY + Math.sin(angle) * rad);
      x.strokeStyle = `rgba(191,0,255,${alp * .18})`;
      x.lineWidth   = .4;
      x.globalAlpha = alp * .6;
      x.shadowBlur  = 0;
      x.stroke();
    }
  });

  x.globalAlpha = 1;
  x.shadowBlur  = 0;

  // Core glow
  const coreR = warpActive ? 160 + camZoom * 100 : 80 + Math.sin(t * .04) * 14;
  const coreG = x.createRadialGradient(CX, CY, 0, CX, CY, coreR);
  coreG.addColorStop(0,   `rgba(220,50,255,${warpActive ? .95 : .35})`);
  coreG.addColorStop(.3,  `rgba(191,0,255,${warpActive ? .5  : .15})`);
  coreG.addColorStop(.7,  `rgba(60,0,120,${warpActive ? .2   : .05})`);
  coreG.addColorStop(1,   'transparent');
  x.fillStyle = coreG;
  x.fillRect(0, 0, W, H);

  // Second cyan core layer
  const cyanR = (warpActive ? 100 : 35) + Math.cos(t * .05) * 8;
  const cyanG = x.createRadialGradient(CX, CY, 0, CX, CY, cyanR);
  cyanG.addColorStop(0,  `rgba(0,255,255,${warpActive ? .3 : .1})`);
  cyanG.addColorStop(.5, `rgba(0,200,255,${warpActive ? .1 : .03})`);
  cyanG.addColorStop(1,  'transparent');
  x.fillStyle = cyanG;
  x.fillRect(0, 0, W, H);

  // Synaptic dots
  for (let d = 0; d < 36; d++) {
    const ang  = (d / 36) * Math.PI * 2 + t * .006;
    const dist = 90 + Math.sin(d * 1.2 + t * .022) * 70;
    const px   = CX + Math.cos(ang) * dist * camZoom;
    const py   = CY + Math.sin(ang) * dist * .5 * camZoom;
    const a    = (.25 + Math.sin(d + t * .05) * .2) * (warpActive ? 1.8 : 1);
    x.beginPath();
    x.arc(px, py, d % 5 === 0 ? 2.5 : 1.5, 0, Math.PI * 2);
    const col = d % 7 === 0 ? '0,255,255' : '191,0,255';
    x.fillStyle = `rgba(${col},${Math.min(a, 1)})`;
    x.shadowColor = d % 7 === 0 ? '#00FFFF' : '#BF00FF';
    x.shadowBlur  = 10;
    x.fill();
  }
  x.shadowBlur = 0;
}

function updateRings() {
  const spd = warpActive ? SPEED * 5 : SPEED;
  rings.forEach(r => {
    r.z += spd * .003;
    if (r.z > 1) {
      r.z = 0.02;
      r.hue   = 270 + Math.random() * 70 - 35;
      r.cyan  = Math.random() > .72;
      r.twist = Math.random() * Math.PI * 2;
    }
  });
  if (warpActive) camZoom = Math.min(camZoom * 1.05, 4);
}

/* ══════════════════════════════════════════════
   FLOATING PARTICLES
══════════════════════════════════════════════ */
const particles = [];
for (let i = 0; i < 80; i++) {
  const { W, H } = partCtx;
  particles.push({
    x: Math.random() * (window.innerWidth),
    y: Math.random() * (window.innerHeight),
    vx: (Math.random() - .5) * .3,
    vy: -(Math.random() * .6 + .1),
    size: Math.random() * 2 + .5,
    alpha: Math.random() * .6 + .1,
    hue: Math.random() > .6 ? 'cyan' : 'purple',
    life: Math.random(),
    maxLife: .6 + Math.random() * .4,
  });
}

function drawParticles() {
  const { x, W, H } = partCtx;
  x.clearRect(0, 0, W, H);
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy;
    p.life += .003;
    if (p.life > p.maxLife || p.y < -10) {
      p.x = Math.random() * W;
      p.y = H + 10;
      p.life = 0;
      p.alpha = Math.random() * .6 + .1;
    }
    const a = p.alpha * Math.sin(p.life / p.maxLife * Math.PI);
    x.beginPath();
    x.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    const col = p.hue === 'cyan' ? '0,255,255' : '191,0,255';
    x.fillStyle  = `rgba(${col},${a})`;
    x.shadowColor = p.hue === 'cyan' ? '#00FFFF' : '#BF00FF';
    x.shadowBlur  = 6;
    x.fill();
  });
  x.shadowBlur = 0;
}

/* ══════════════════════════════════════════════
   ELECTRIC ARCS
══════════════════════════════════════════════ */
let arcs = [];
function spawnArc() {
  const { W, H, CX, CY } = arcCtx;
  const angle = Math.random() * Math.PI * 2;
  const dist  = Math.min(W, H) * (.15 + Math.random() * .25);
  const sx = CX + Math.cos(angle) * dist;
  const sy = CY + Math.sin(angle) * dist;
  const ea = angle + (Math.random() - .5) * 1.5;
  const ed = dist * (.5 + Math.random() * .8);
  arcs.push({
    sx, sy,
    ex: CX + Math.cos(ea) * ed,
    ey: CY + Math.sin(ea) * ed,
    segs: 5 + Math.floor(Math.random() * 5),
    alpha: .5 + Math.random() * .4,
    life: 0,
    maxLife: 8 + Math.random() * 12,
    cyan: Math.random() > .5,
  });
}

function drawArcs() {
  const { x, W, H } = arcCtx;
  x.clearRect(0, 0, W, H);
  arcs = arcs.filter(a => a.life < a.maxLife);
  arcs.forEach(a => {
    a.life++;
    const progress = a.life / a.maxLife;
    const alp = a.alpha * Math.sin(progress * Math.PI) * (warpActive ? 2 : 1);

    // Generate jagged path
    const pts = [[a.sx, a.sy]];
    for (let i = 1; i < a.segs; i++) {
      const frac = i / a.segs;
      const bx = a.sx + (a.ex - a.sx) * frac;
      const by = a.sy + (a.ey - a.sy) * frac;
      pts.push([bx + (Math.random()-0.5)*40, by + (Math.random()-0.5)*40]);
    }
    pts.push([a.ex, a.ey]);

    x.beginPath();
    x.moveTo(pts[0][0], pts[0][1]);
    pts.slice(1).forEach(p => x.lineTo(p[0], p[1]));
    const col = a.cyan ? '0,255,255' : '191,0,255';
    x.strokeStyle = `rgba(${col},${Math.min(alp, 1)})`;
    x.lineWidth   = .6;
    x.shadowColor = a.cyan ? '#00FFFF' : '#BF00FF';
    x.shadowBlur  = 12;
    x.stroke();
  });
  x.shadowBlur = 0;
}

/* ══════════════════════════════════════════════
   ENERGY BURST LINES (idle emanation)
══════════════════════════════════════════════ */
let energyLines = [];
function spawnEnergyLine() {
  const { W, H, CX, CY } = energyCtx;
  const angle = Math.random() * Math.PI * 2;
  energyLines.push({
    angle,
    length: 0,
    maxLen: Math.min(W, H) * (.15 + Math.random() * .35),
    speed:  4 + Math.random() * 6,
    alpha:  .15 + Math.random() * .25,
    life: 0, maxLife: 30 + Math.random() * 20,
    cyan: Math.random() > .6,
    width: .3 + Math.random() * .5,
    startDist: 20 + Math.random() * 40,
  });
}

function drawEnergyLines() {
  const { x, W, H, CX, CY } = energyCtx;
  x.clearRect(0, 0, W, H);
  energyLines = energyLines.filter(e => e.life < e.maxLife);
  energyLines.forEach(e => {
    e.life++;
    e.length = Math.min(e.length + e.speed, e.maxLen);
    const progress = e.life / e.maxLife;
    const alp = e.alpha * Math.sin(progress * Math.PI);
    const startX = CX + Math.cos(e.angle) * e.startDist;
    const startY = CY + Math.sin(e.angle) * e.startDist;
    const endX   = CX + Math.cos(e.angle) * (e.startDist + e.length);
    const endY   = CY + Math.sin(e.angle) * (e.startDist + e.length);

    const col = e.cyan ? '0,255,255' : '191,0,255';
    const grad = x.createLinearGradient(startX, startY, endX, endY);
    grad.addColorStop(0, `rgba(${col},${alp})`);
    grad.addColorStop(1, `rgba(${col},0)`);

    x.beginPath();
    x.moveTo(startX, startY);
    x.lineTo(endX, endY);
    x.strokeStyle = grad;
    x.lineWidth   = e.width;
    x.shadowColor = e.cyan ? '#00FFFF' : '#BF00FF';
    x.shadowBlur  = 6;
    x.stroke();
  });
  x.shadowBlur = 0;
}

/* ══════════════════════════════════════════════
   CARD TILT (mouse parallax)
══════════════════════════════════════════════ */
const card = document.getElementById('redirectCard');
document.addEventListener('mousemove', e => {
  const cx = window.innerWidth / 2, cy = window.innerHeight / 2;
  const dx = (e.clientX - cx) / cx;
  const dy = (e.clientY - cy) / cy;
  card.style.transform = `perspective(800px) rotateY(${dx*4}deg) rotateX(${-dy*3}deg)`;
});

/* ══════════════════════════════════════════════
   HUD LIVE DATA
══════════════════════════════════════════════ */
const pingEl   = document.getElementById('pingVal');
const statusEl = document.getElementById('statusTxt');
const syncEl   = document.getElementById('syncPct');
const timeEl   = document.getElementById('timeDisp');
const sysIdEl  = document.getElementById('sysId');

const statuses = ['CONNECTING','HANDSHAKE','VERIFYING','LINKED'];
let   syncVal  = 0;

setInterval(() => {
  pingEl.textContent = (12 + Math.floor(Math.random() * 8));
}, 800);

setInterval(() => {
  syncVal = Math.min(syncVal + Math.random() * 8, 100);
  syncEl.textContent = Math.floor(syncVal);
  if (syncVal >= 33  && syncVal < 66)  statusEl.textContent = statuses[1];
  else if (syncVal >= 66 && syncVal < 90) statusEl.textContent = statuses[2];
  else if (syncVal >= 90) statusEl.textContent = statuses[3];
}, 500);

setInterval(() => {
  const n = Date.now();
  const h = String(Math.floor(n/3600000)%24).padStart(2,'0');
  const m = String(Math.floor(n/60000)%60).padStart(2,'0');
  const s = String(Math.floor(n/1000)%60).padStart(2,'0');
  timeEl.textContent = `${h}:${m}:${s}`;
}, 1000);

// SysID glitch
const chars = 'ABCDEF0123456789';
setInterval(() => {
  if (Math.random() > .85) {
    const base = 'N4RU4-7X';
    sysIdEl.textContent = base.split('').map(c =>
      Math.random() > .7 ? chars[Math.floor(Math.random()*chars.length)] : c
    ).join('');
    setTimeout(() => sysIdEl.textContent = 'N4RU4-7X', 120);
  }
}, 2000);

/* ══════════════════════════════════════════════
   MAIN LOOP
══════════════════════════════════════════════ */
let arcTimer = 0, energyTimer = 0;

function loop() {
  t++;
  updateRings();
  drawTunnel();
  drawParticles();

  arcTimer++;
  if (arcTimer > (warpActive ? 2 : 18)) {
    spawnArc();
    arcTimer = 0;
  }
  drawArcs();

  energyTimer++;
  if (energyTimer > (warpActive ? 1 : 8)) {
    spawnEnergyLine();
    energyTimer = 0;
  }
  drawEnergyLines();

  requestAnimationFrame(loop);
}
loop();

/* ══════════════════════════════════════════════
   COUNTDOWN + WARP REDIRECT
══════════════════════════════════════════════ */
const TOTAL   = 5;
const ARC_LEN = 138;
const arc     = document.getElementById('ringArc');
const numEl   = document.getElementById('cdNum');
const msgEl   = document.getElementById('cdMsg');
const msgs    = [
  'Iniciando portal…',
  'Calibrando mente…',
  'Sincronizando…',
  'Abrindo portal…',
  'Entrando!'
];

let secs = TOTAL;

function tick() {
  secs--;
  if (secs <= 0) {
    numEl.textContent = '0';
    msgEl.textContent = '🚀 Entrando!';
    arc.style.strokeDashoffset = ARC_LEN;
    arc.style.stroke = 'var(--cyan)';

    warpActive = true;
    document.getElementById('warp-overlay').classList.add('go');

    setTimeout(() => {
      window.location.href = 'http://naruarpg.gamer.gd/narua.php';
    }, 850);
    return;
  }
  numEl.textContent = secs;
  msgEl.textContent = msgs[TOTAL - secs] || 'Aguarde…';
  const pct = (TOTAL - secs) / TOTAL;
  arc.style.strokeDashoffset = pct * ARC_LEN;

  // Pulse card on each tick
  card.style.boxShadow = `
    0 0 0 1px rgba(191,0,255,.08),
    0 0 80px rgba(191,0,255,.35),
    0 0 160px rgba(191,0,255,.1),
    inset 0 1px 0 rgba(191,0,255,.15)
  `;
  setTimeout(() => {
    card.style.boxShadow = '';
  }, 300);
}

setInterval(tick, 1000);
</script>
</body>
